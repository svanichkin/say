name: Build and Release Say

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # the builds without a release, to try them

permissions:
  contents: write
  packages: write

# Babe (the smooth video coder) is a private module: go fetches it over SSH
# with BABE_SSH_KEY (the private half of a read-only deploy key of
# svanichkin/Babe), not through the public proxy and checksum database.
env:
  GOPRIVATE: github.com/svanichkin/Babe

jobs:
  build_check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Access the private Babe module
        shell: bash
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
          chmod 600 ~/.ssh/babe
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
          git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'

      - name: Build
        run: go build -v ./...

      # The packages scripts/check.sh tests (the ones that are green), as
      # before a release locally; the builds for other systems are the jobs.
      - name: Test
        run: SKIP_CROSS=1 bash scripts/check.sh

  build_linux:
    name: Build Linux (${{ matrix.name }})
    # Native runners: cgo (miniaudio) needs a C compiler for the target.
    runs-on: ${{ matrix.os }}
    needs: build_check
    strategy:
      fail-fast: false
      matrix:
        # amd64 twice: for any x86-64 CPU (v1: the C code too, not
        # ubuntu-latest's GCC, which builds for x86-64-v3 and marks the
        # binary so: older CPUs refuse it, issue 14), and for CPUs with AVX2
        # (v3: Go's code and miniaudio's). The install script picks.
        include:
          - arch: amd64
            name: amd64
            os: ubuntu-24.04
            goamd64: v1
            cflags: -O2 -march=x86-64 -mtune=generic
          - arch: amd64
            name: amd64-v3
            os: ubuntu-24.04
            goamd64: v3
            cflags: -O2 -march=x86-64-v3
          - arch: arm64 # PinePhone and other ARM boards
            name: arm64
            os: ubuntu-24.04-arm
          - arch: arm # 32-bit Raspberry Pi OS and other ARMv7 boards
            name: armv7
            os: ubuntu-24.04
            goarm: '7'
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
    steps:
      - uses: actions/checkout@v4

      - name: Access the private Babe module
        shell: bash
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
          chmod 600 ~/.ssh/babe
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
          git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'

      - name: Cross compiler for linux/${{ matrix.name }}
        if: matrix.cc != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build linux/${{ matrix.name }}
        env:
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
          CGO_CFLAGS: ${{ matrix.cflags }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          [ -n "$GOARM" ] || unset GOARM
          [ -n "$CC" ] || unset CC
          [ -n "$CXX" ] || unset CXX
          export GOOS=linux
          export GOARCH=${{ matrix.arch }}
          export CGO_ENABLED=1
          [ -n "$GOAMD64" ] || unset GOAMD64
          [ -n "$CGO_CFLAGS" ] || unset CGO_CFLAGS
          go build -v -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o say .
          tar czvf say-linux-${{ matrix.name }}.tar.gz say

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: say-linux-${{ matrix.name }}
          path: say-linux-${{ matrix.name }}.tar.gz

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build_check
    steps:
      - uses: actions/checkout@v4

      - name: Access the private Babe module
        shell: bash
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
          chmod 600 ~/.ssh/babe
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
          git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'

      - name: Build windows/amd64
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          CGO_CFLAGS: -Wno-stringop-overread
        run: |
          go env
          go build -v -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o say.exe .
          ls -la
          tar czvf say-windows-amd64.tar.gz say.exe
          # winget takes a .zip, not a .tar.gz
          7z a say-windows-amd64.zip say.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: say-windows-amd64
          path: |
            say-windows-amd64.tar.gz
            say-windows-amd64.zip

  build_darwin:
    name: Build macOS
    # Both architectures here: their binaries (the terminal utility) and a
    # Say.app of each, signed with the Developer ID and notarized when the
    # secrets are there (as LVNC's):
    #   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate and key (.p12)
    #   DEVELOPER_ID_P12_PASSWORD  its password
    #   NOTARY_KEY                 base64 of an App Store Connect API key (.p8)
    #   NOTARY_KEY_ID              its key ID
    #   NOTARY_ISSUER_ID           its issuer ID
    # Without them Say.app is signed ad hoc.
    runs-on: macos-latest
    needs: build_check
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Access the private Babe module
        shell: bash
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
          chmod 600 ~/.ssh/babe
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
          git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'

      - name: Build darwin/amd64 and darwin/arm64
        run: |
          for arch in amd64 arm64; do
            mkdir -p bin-$arch
            GOOS=darwin GOARCH=$arch CGO_ENABLED=1 go build -v -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o bin-$arch/say .
            tar czvf say-darwin-$arch.tar.gz -C bin-$arch say
          done

      - name: Make Say.app for each
        run: |
          go run ./cmd/sayicon -out assets/icon -gui "$RUNNER_TEMP/gui-icon"
          for arch in amd64 arm64; do
            sh scripts/macos-app.sh bin-$arch/say "$GITHUB_REF_NAME" dist-$arch
          done

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # The SHA-1, so the certificate's name never reaches the log.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "::error::no Developer ID Application identity in the .p12"; exit 1; fi
          echo "::add-mask::$IDENTITY"
          echo "SAY_SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign and notarize Say.app
        if: env.HAS_CERT == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SAY_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          SAY_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ "$HAS_NOTARY" = true ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export SAY_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          else
            export SAY_SIGN_ONLY=1
          fi
          for arch in amd64 arm64; do
            bash scripts/notarize.sh dist-$arch/Say.app
          done
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Pack Say.app
        run: |
          for arch in amd64 arm64; do
            [ -f dist-$arch/Say-macos.zip ] || ditto -c -k --keepParent dist-$arch/Say.app dist-$arch/Say-macos.zip
            mv dist-$arch/Say-macos.zip say-macos-$arch.zip
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: say-darwin
          path: |
            say-darwin-amd64.tar.gz
            say-darwin-arm64.tar.gz
            say-macos-amd64.zip
            say-macos-arm64.zip

  build_bsd:
    name: Build ${{ matrix.os }}
    # No BSD runners: each builds in a virtual machine of its system, with
    # cgo (miniaudio: OSS on FreeBSD, sndio on OpenBSD, audio(4) on NetBSD).
    # No camera backend in gocam there yet: Say goes on without video.
    runs-on: ubuntu-latest
    needs: build_check
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
    steps:
      - uses: actions/checkout@v4

      - name: Build freebsd/amd64
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
          REF: ${{ github.ref_name }}
          OS: freebsd
        with:
          envs: 'BABE_SSH_KEY REF OS'
          usesh: true
          prepare: pkg install -y go git
          run: |
            mkdir -p ~/.ssh
            printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
            chmod 600 ~/.ssh/babe
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
            git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"
            git config --global --add safe.directory '*' # the checkout is the runner's, not this machine's user's
            export PATH=$PATH:/usr/local/go/bin:/usr/pkg/bin:$(ls -d /usr/pkg/go*/bin 2>/dev/null | tail -1) GOPRIVATE=github.com/svanichkin/Babe GOTOOLCHAIN=auto CGO_ENABLED=1
            go build -v -trimpath -ldflags "-s -w -X main.version=$REF" -o say .
            tar czvf say-$OS-amd64.tar.gz say

      - name: Build openbsd/amd64
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
          REF: ${{ github.ref_name }}
          OS: openbsd
        with:
          envs: 'BABE_SSH_KEY REF OS'
          usesh: true
          prepare: pkg_add go git
          run: |
            mkdir -p ~/.ssh
            printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
            chmod 600 ~/.ssh/babe
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
            git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"
            git config --global --add safe.directory '*' # the checkout is the runner's, not this machine's user's
            export PATH=$PATH:/usr/local/go/bin:/usr/pkg/bin:$(ls -d /usr/pkg/go*/bin 2>/dev/null | tail -1) GOPRIVATE=github.com/svanichkin/Babe GOTOOLCHAIN=auto CGO_ENABLED=1
            go build -v -trimpath -ldflags "-s -w -X main.version=$REF" -o say .
            tar czvf say-$OS-amd64.tar.gz say

      - name: Build netbsd/amd64
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
          REF: ${{ github.ref_name }}
          OS: netbsd
        with:
          envs: 'BABE_SSH_KEY REF OS'
          usesh: true
          prepare: /usr/sbin/pkg_add pkgin; pkgin -y install go git
          run: |
            mkdir -p ~/.ssh
            printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
            chmod 600 ~/.ssh/babe
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
            git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"
            git config --global --add safe.directory '*' # the checkout is the runner's, not this machine's user's
            export PATH=$PATH:/usr/local/go/bin:/usr/pkg/bin:$(ls -d /usr/pkg/go*/bin 2>/dev/null | tail -1) GOPRIVATE=github.com/svanichkin/Babe GOTOOLCHAIN=auto CGO_ENABLED=1
            go build -v -trimpath -ldflags "-s -w -X main.version=$REF" -o say .
            tar czvf say-$OS-amd64.tar.gz say

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: say-${{ matrix.os }}-amd64
          path: say-${{ matrix.os }}-amd64.tar.gz

  build_plan9:
    name: Build Plan 9
    # Pure Go: no cgo on Plan 9 (camera via nusb/cam, sound via /dev/audio).
    runs-on: ubuntu-latest
    needs: build_check
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, 386, arm]
    steps:
      - uses: actions/checkout@v4

      - name: Access the private Babe module
        shell: bash
        env:
          BABE_SSH_KEY: ${{ secrets.BABE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BABE_SSH_KEY" > ~/.ssh/babe
          chmod 600 ~/.ssh/babe
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/babe -o IdentitiesOnly=yes"
          git config --global url."git@github.com:svanichkin/Babe".insteadOf "https://github.com/svanichkin/Babe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.x'

      - name: Build plan9/${{ matrix.arch }}
        run: |
          export GOOS=plan9
          export GOARCH=${{ matrix.arch }}
          export CGO_ENABLED=0
          go build -v -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o say .
          tar czvf say-plan9-${{ matrix.arch }}.tar.gz say

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: say-plan9-${{ matrix.arch }}
          path: say-plan9-${{ matrix.arch }}.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build_bsd
      - build_linux
      - build_windows
      - build_darwin
      - build_plan9
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.zip' \) | while read file; do
            echo "Checksum for $file"
            openssl dgst -sha256 -r "$file" | awk '{print $1}' > "${file}.sha256"
          done
          ls -laR

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: true

  winget:
    name: winget
    # A pull request to microsoft/winget-pkgs with the new version, from the
    # fork svanichkin/winget-pkgs (needs WINGET_TOKEN: a classic token with
    # public_repo). The package's first version went there by hand.
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: svanichkin.Say
          installers-regex: 'say-windows-amd64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
